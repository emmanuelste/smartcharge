<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCharge Tanzania Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(135deg, #f5f7ff 0%, #edf4ff 100%);
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-800">
    <div class="mx-auto max-w-7xl px-6 py-10">
      <header class="mb-10 rounded-3xl border border-slate-200 bg-white/80 p-6 shadow-sm backdrop-blur">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-emerald-600">SmartCharge Tanzania</p>
            <h1 class="mt-2 text-3xl font-black text-slate-900">E-Mobility Ecosystem</h1>
          </div>
          <div class="rounded-2xl bg-slate-100 px-4 py-2 text-sm font-medium text-slate-700">
            Frontend + Backend app
          </div>
        </div>
      </header>

      <main>
        <div class="mb-6 flex items-center justify-between">
          <h2 class="text-2xl font-bold text-slate-900">Available portals</h2>
          <button id="refreshButton" class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700">
            Refresh list
          </button>
        </div>

        <div id="portalGrid" class="grid gap-5 md:grid-cols-2 xl:grid-cols-3"></div>
      </main>
    </div>

    <script>
      const portalGrid = document.getElementById('portalGrid');
      const refreshButton = document.getElementById('refreshButton');

      function buildPortalCard(portal) {
        return `
          <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-1 hover:shadow-lg">
            <div class="mb-4 flex items-center justify-between">
              <span class="rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-bold uppercase tracking-wide text-emerald-700">Portal</span>
              <span class="text-xs text-slate-500">${portal.slug}</span>
            </div>
            <h3 class="text-xl font-bold text-slate-900">${portal.title}</h3>
            <p class="mt-3 text-sm leading-6 text-slate-600">
              A SmartCharge Tanzania experience for the e-mobility operational workflow.
            </p>
            <div class="mt-6 flex items-center justify-between">
              <span class="text-xs font-medium uppercase tracking-[0.16em] text-slate-400">Frontend</span>
              <a href="${portal.route}" class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-500">
                Open portal
              </a>
            </div>
          </article>
        `;
      }

      async function loadPortals() {
        try {
          const response = await fetch('/api/portals');
          const payload = await response.json();
          const portals = payload.portals || [];

          if (!portals.length) {
            portalGrid.innerHTML = '<p class="text-slate-500">No portals were found.</p>';
            return;
          }

          portalGrid.innerHTML = portals.map(buildPortalCard).join('');
        } catch (error) {
          portalGrid.innerHTML = '<p class="text-red-600">Unable to load the portal list.</p>';
        }
      }

      refreshButton.addEventListener('click', loadPortals);
      loadPortals();
    </script>
  </body>
</html>
